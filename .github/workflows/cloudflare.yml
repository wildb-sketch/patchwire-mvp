name: Deploy to Cloudflare
on:
  workflow_dispatch:
    inputs:
      provision_only:
        description: 'Verify/provision private backups without deploying app code'
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: cloudflare
      - name: Prepare private backups and deployment bindings
        run: node cloudflare/scripts/prepare-deployment.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        if: ${{ !inputs.provision_only }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: '4.158.0'
          command: deploy --config wrangler.deploy.toml
