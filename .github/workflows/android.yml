name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      verify_turn:
        description: 'Run a live Cloudflare TURN RTP check (creates one diagnostic account)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['mobile/**', 'public/**', 'tests/**', 'lib/**', 'server.js', 'cloudflare/src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'public/**', 'tests/**', 'lib/**', 'server.js', 'cloudflare/src/**', '.github/workflows/android.yml']
jobs:
  turn:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_turn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify RTP through Cloudflare relay and TLS port 443
        run: node scripts/verify-turn.cjs
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore persistent Android test signing key
        run: node scripts/restore-signing-key.js
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      - run: npm ci
      - run: npm run prepare-android
      - name: Copy google-services.json
        run: |
          if [ -f "../google-services.json" ]; then
            cp ../google-services.json android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "No google-services.json found, skipping FCM setup"
          fi
      - name: Install signaling test dependency
        run: npm ci --prefix ..
      - name: Verify voice room lifecycle
        run: node --test ../tests/*.test.js
      - name: Install Cloudflare test runtime
        run: npm ci --prefix ../cloudflare
      - name: Verify TURN in the actual Workers runtime
        working-directory: .
        run: npm run test:worker
      - name: Install WebRTC test browser
        working-directory: .
        run: npx playwright install --with-deps chromium
      - name: Verify real WebRTC negotiation and recovery
        working-directory: .
        run: npm run test:webrtc
      - run: npm run apk
      - name: Lint Android integration
        run: cd android && ./gradlew lintDebug testDebugUnitTest
      - name: Record APK signing fingerprint for verified links
        run: node scripts/apk-fingerprint.js
      - uses: actions/upload-artifact@v4
        with:
          name: patchwire-debug-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-link-fingerprint.txt
