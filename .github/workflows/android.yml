name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/**', 'tests/**', 'server.js', 'cloudflare/src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'public/**', 'tests/**', 'server.js', 'cloudflare/src/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run prepare-android
      - name: Copy google-services.json
        run: |
          if [ -f "../google-services.json" ]; then
            cp ../google-services.json android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "No google-services.json found, skipping FCM setup"
          fi
      - name: Install signaling test dependency
        run: npm ci --prefix ..
      - name: Verify voice room lifecycle
        run: node --test ../tests/*.test.js
      - run: npm run apk
      - name: Lint Android integration
        run: cd android && ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patchwire-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
