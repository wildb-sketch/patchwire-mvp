name = "patchwire"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The website (the same files the Node server serves) is served from here.
[assets]
directory = "../public"

# One Durable Object holds accounts, messages, rooms and live connections.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Optional settings. See TURN.md. Keep TURN_KEY_ID and TURN_KEY_API_TOKEN in Worker secrets.
# npx wrangler secret put TURN_KEY_ID
# npx wrangler secret put TURN_KEY_API_TOKEN
# Other secrets: ANTHROPIC_API_KEY, or TURN_PASS for an existing static TURN provider.
[vars]
FCM_PROJECT_ID = "patchwire-c4a0c"
PUBLIC_ORIGIN = "https://patchwire.whassabi.workers.dev"
ANDROID_APP_LINK_SHA256 = "2D:6F:D1:A4:05:CF:B6:D7:8F:1C:51:0F:D5:E0:AC:3F:F2:C3:95:42:DF:65:7E:B5:E8:FA:AA:3E:E8:3A:32:67"
# Push signing credentials: Worker secret FCM_SERVICE_ACCOUNT (service-account JSON).
# Verified Android links: ANDROID_APP_LINK_SHA256 (public certificate fingerprint; see mobile/PUSH-AND-LINKS.md).
# ROOM_GRACE_MS = "45000"
# TURN_URL = "turn:your-turn-host:3478,turns:your-turn-host:5349"
# TURN_USER = ""

# Console events contain only explicitly sanitized operation categories/statuses.
# Invocation logs are disabled because legacy WebSocket URLs contain session tokens.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
