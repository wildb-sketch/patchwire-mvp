<p id="msg">Enter the address of your Patchwire server.</p>
<input id="u" type="url" inputmode="url" placeholder="https://your-server.trycloudflare.com" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Server address">
<button id="go">Connect</button><div id="e" role="alert"></div>
<small>Voice needs a secure (https) address. You can change the server later from Profile.</small>
</main>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);let saved=null;
try{saved=localStorage.getItem('pw_server')}catch(e){}
function norm(v){try{const x=new URL(/^https?:\/\//.test(v)?v:'https://'+v);if(x.protocol!=='https:')return null;return x.origin}catch(e){return null}}
async function connect(v,auto){
  const o=norm(v);if(!o){$('#e').textContent='Enter a valid https address.';return}
  $('#e').textContent='';$('#go').disabled=true;$('#go').textContent='Connecting…';
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);await fetch(o+'/healthz',{mode:'no-cors',cache:'no-store',signal:c.signal});clearTimeout(t)}
  catch(e){$('#go').disabled=false;$('#go').textContent='Connect';$('#e').textContent='Could not reach '+o+'. Is the server running?';$('#u').value=o;return}
  try{localStorage.setItem('pw_server',o)}catch(e){}
  location.replace(o);
}
$('#go').onclick=()=>connect($('#u').value);
$('#u').onkeydown=e=>{if(e.key==='Enter')connect($('#u').value)};
if(saved){$('#u').value=saved;if(!q.has('change')){$('#msg').textContent='Opening your server…';connect(saved,true)}}
