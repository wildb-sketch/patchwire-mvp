<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchwire</title>
<script>try{if(localStorage.getItem('pw_design')==='green')location.replace('/');else localStorage.setItem('pw_design','neon')}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12062a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12062a;--s1:#241347;--s2:#2a1855;--s3:#33206a;--s4:#3b2578;--line:#4a2d85;--ink:#fff;--mute:#b7a5e6;--lime:#ffd91a;--yel:#ffd91a;--on:#1a0b33;--red:#ff4d6d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:#000}
body{color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.gr{font-family:'Poppins',system-ui,sans-serif}
#app{width:100%;max-width:430px;min-height:100vh;position:relative}
/* header */
.hd{position:sticky;top:0;z-index:20;background:#000e;backdrop-filter:blur(24px);border-bottom:1px solid var(--line);box-shadow:0 1px 12px #000c;padding-top:env(safe-area-inset-top,0px)}
.hr{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.hr h1{font:700 26px 'Poppins',sans-serif;letter-spacing:-.65px}
.hr .ac{display:flex;align-items:center;gap:4px}
.ibt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff}
.ibt .nd{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}
.pbt{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;margin-left:4px;box-shadow:0 4px 6px #ffd91a40;font:700 14px 'Poppins'}
main{padding:16px 16px 210px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px}
.chip{flex:none;display:inline-flex;gap:4px;align-items:center;padding:9px 17px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mute);font:400 15px 'Poppins',sans-serif;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#000;font-weight:700;box-shadow:0 4px 6px #ffd91a40}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 50px -12px #000;margin-top:16px}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(64px);pointer-events:none}
.hero::before{width:208px;height:208px;right:-64px;top:-64px;background:#ffd91a1f}
.hero::after{width:192px;height:192px;left:-64px;bottom:-64px;background:#ffd91a0f}
.art{position:relative;height:132px;overflow:hidden}
.art::after{content:'';position:absolute;left:0;right:0;bottom:0;height:56px;background:repeating-linear-gradient(90deg,#ffd91a66 0 3px,transparent 3px 10px);-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.gf{position:absolute;inset:0;background:linear-gradient(to top,var(--s1),#11111599 50%,#11111500);z-index:1}
.tp2{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.pl{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:#000e;backdrop-filter:blur(12px);border:1px solid var(--line);font:500 13px 'Poppins'}
.pl.lv{border-color:#ffd91a66;color:var(--lime);font:700 10px 'Poppins';letter-spacing:.5px;text-transform:uppercase}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.35}}
.hb{position:relative;z-index:2;padding:0 20px 20px;margin-top:-22px}
.r2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp{flex:1;min-width:0}
.ht{font:700 20px 'Poppins';letter-spacing:-.4px}
.mt1{color:var(--mute);font-size:14px}
.nm2{font:600 16px 'Poppins'}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* avatars */
.avw{position:relative;display:inline-block;flex:none}
.av{border-radius:50%;display:grid;place-items:center;font:700 15px 'Poppins';color:#fff;flex:none}
.rg{box-shadow:0 0 0 2px var(--lime),0 4px 14px #ffd91a40}
.rg2{box-shadow:0 0 0 2px #ffd91a99}
.bd{position:absolute;right:-3px;bottom:-3px;display:grid;place-items:center;background:var(--lime);color:#000;border-radius:999px;min-width:16px;height:16px;border:2px solid var(--s1)}
.bd.t{font:700 8px/12px 'Poppins';text-transform:uppercase;padding:0 4px;height:auto;border:0;right:0;bottom:0}
.bd.mu{background:#2a2a31;color:var(--mute)}
.stk{display:inline-flex;align-items:center}.stk .av{margin-left:-8px;border:1.5px solid #000}.stk .av:first-child{margin-left:0}
.stk em{margin-left:-8px;width:20px;height:20px;border-radius:50%;background:var(--s3);border:1px solid #ffd91a66;color:var(--lime);font:700 9px/18px Arial;text-align:center;font-style:normal}
.pil2{display:inline-flex;align-items:center;padding:2px 4px;border-radius:999px;background:#000e;border:1px solid var(--line)}
/* buttons */
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:10px 16px;border-radius:999px;background:var(--lime);color:#000;font:700 15px 'Poppins';box-shadow:0 4px 8px #ffd91a4d}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 13px;font-size:13px}.btn.w{width:100%;padding:14px}
.btn.g{background:var(--s3);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn.o{background:transparent;color:var(--lime);border:1px solid #ffd91a99;box-shadow:none}
.btn.rd{background:transparent;color:var(--red);border:1px solid #ff4d5e55;box-shadow:none}
/* sections */
.sc{display:flex;justify-content:space-between;align-items:center;margin:24px 0 8px;font:600 16px 'Poppins'}
.sc .l{display:flex;align-items:center;gap:6px}.sc b{color:var(--lime);font-weight:700;letter-spacing:.4px;font-size:14px}
.sc span.m{color:var(--mute);font-weight:400;display:flex;align-items:center;gap:2px}
.circ{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px}
.cit{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font:400 13px 'Poppins'}
.cit span.tr{max-width:64px}
.inv{width:56px;height:56px;border-radius:50%;background:var(--s3);border:1px solid var(--line);display:grid;place-items:center;color:#fff}
.lr{display:flex;justify-content:space-between;gap:8px;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:8px;box-shadow:0 4px 6px -1px #0006}
.lr .l{display:flex;gap:10px;align-items:center;min-width:0}
.tl{font:700 12px 'Poppins';letter-spacing:.8px;text-transform:uppercase;color:var(--lime)}
.lt{font:600 16px 'Poppins'}
.lr .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;color:var(--mute);font:400 13px 'Poppins';flex:none}
.rt .h{display:flex;gap:4px;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mute{color:var(--mute)}.s{font-size:13px}.c{text-align:center}
.lime{color:var(--lime)}.row{display:flex;align-items:center;gap:10px}
.empty{text-align:center;padding:26px 14px;color:var(--mute)}.empty img{width:120px}
/* mini */
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:398px;z-index:15;background:#141418f2;backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:16px;padding:9px;display:flex;align-items:center;gap:8px;box-shadow:0 25px 50px -12px #000}
.mini[hidden]{display:none}
.mini .ic{width:40px;height:40px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px #ffd91a40}
.mini .t{flex:1;min-width:0}.mini .t small{display:flex;align-items:center;gap:6px;font:700 10px 'Poppins';letter-spacing:.5px;color:var(--lime)}
.mini .t small i{width:6px;height:6px;border-radius:50%;background:var(--lime)}
.mini .t span{display:block;font:500 15px 'Poppins';overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb2{width:40px;height:40px;border-radius:50%;background:var(--s4);display:grid;place-items:center;flex:none;position:relative}
.mb2.off{color:var(--red);background:#2a1215}
.mb2.x{width:32px;height:32px;background:transparent;color:var(--mute)}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:18;background:#000f;backdrop-filter:blur(24px);border-top:1px solid var(--line);box-shadow:0 -4px 24px #000c;padding:0 16px env(safe-area-inset-bottom,0px)}
nav .ni{height:64px;display:flex;align-items:center;justify-content:space-between}
nav button{min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font:400 12px 'Poppins';position:relative}
nav button[aria-current=page]{color:var(--lime);font-weight:700}
nav .go{position:relative;top:-20px;width:56px;margin-bottom:-8px}
nav .go i{width:56px;height:56px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;box-shadow:0 4px 10px #ffd91a59;font-style:normal}
nav .go span{color:#fff;font-weight:500;margin-top:4px}
nav b.bg{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--lime);color:#000;font:700 10px/16px 'Poppins';text-align:center;padding:0 4px}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:#000;display:flex;justify-content:center}
.ov[hidden]{display:none}.ov>div{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#000e}
.ph .tt{font:700 18px 'Poppins'}
.ib2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ib2.sq{background:var(--s3);border:1px solid var(--line)}
.ib2.off{color:var(--red);background:#2a1215;border-color:#5a2128}
.ob{flex:1;overflow:auto;padding:16px}
.md{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:flex-end;justify-content:center}
.md[hidden]{display:none}
.md>div{width:100%;max-width:430px;background:var(--s1);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.md h2{font:700 22px 'Poppins'}
.in{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--s2);padding:0 16px;font-size:16px}
.in.pill{border-radius:999px;height:46px;font-size:15px}
.fi{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font:600 14px 'Poppins'}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:999px;font:500 15px 'Poppins';color:var(--mute);text-align:center}
.seg button[aria-pressed=true]{background:var(--lime);color:#000;font-weight:700}
.seg i{font-style:normal;background:var(--lime);color:#000;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:5px}
.seg [aria-pressed=true] i{background:#000;color:var(--lime)}
.bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);align-items:center;background:#000e}
.bdg{font:700 10px 'Poppins';letter-spacing:.5px;background:var(--lime);color:#000;padding:2px 7px;border-radius:6px;text-transform:uppercase;display:inline-block}
.bdg.g{background:var(--s4);color:var(--mute)}
.tw{position:fixed;left:50%;transform:translateX(-50%);background:var(--lime);color:#000;font:700 14px 'Poppins';padding:11px 18px;border-radius:999px;z-index:99;max-width:90vw;box-shadow:0 6px 24px #000a}
.tw.go{cursor:pointer;text-decoration:underline}
/* room */
.rtop{flex:none;padding:12px 16px 0}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;align-items:flex-start}
.stg{flex:none;width:calc(50% - 5px);min-width:150px;background:linear-gradient(#3b1c78,var(--s1) 70%);border:1px solid #5a37a0;border-radius:16px;padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.stg b{font:700 17px 'Poppins'}
.eqb{display:flex;gap:3px;height:16px;align-items:flex-end;justify-content:center;margin-top:4px}
.eqb i{width:3px;height:4px;background:var(--lime);border-radius:2px;opacity:.5}
.eqb.on i{animation:eqa .6s infinite ease-in-out;opacity:1}.eqb.on i:nth-child(2){animation-delay:.1s}.eqb.on i:nth-child(3){animation-delay:.2s}.eqb.on i:nth-child(4){animation-delay:.3s}.eqb.on i:nth-child(5){animation-delay:.15s}
@keyframes eqa{50%{height:16px}}
.pi{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.pi span{max-width:62px}.qi{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.mini2{font:600 12px 'Poppins';padding:5px 10px;border-radius:999px;background:var(--s3);border:1px solid var(--line)}
.rchat{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 16px 0}
.cmsgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0;overscroll-behavior:contain}
.cl{display:flex;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;overflow-wrap:anywhere}
.cl b{font:700 12px 'Poppins';margin-right:6px}.cl small{color:var(--mute);font-size:11px}
.cl.me{background:#3b1c78;border-color:#5a37a0}
.m{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);line-height:1.35;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--lime);color:#000;border-color:var(--lime)}
.msgs{display:flex;flex-direction:column;gap:8px}
/* start live + misc */
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opc{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;display:flex;flex-direction:column;gap:6px}
.opc[aria-pressed=true]{border-color:var(--lime);background:#3b1c78}
.opc .rd{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opc[aria-pressed=true] .rd{background:var(--lime);border-color:var(--lime);color:#000}
.ico{width:32px;height:32px;border-radius:50%;background:var(--s4);display:grid;place-items:center;color:var(--lime)}
.mb{display:flex;gap:3px;align-items:flex-end;height:22px}.mb i{width:4px;height:4px;background:var(--lime);border-radius:2px}
.tile{width:48px;height:48px;border-radius:12px;flex:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 0;margin-bottom:12px}
.stat b{display:block;font:700 20px 'Poppins'}.stat span{font:500 11px 'Poppins';letter-spacing:.6px;color:var(--mute)}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-top:1px solid var(--line);font:500 15px 'Poppins'}
.li:first-child{border-top:0}.li .sp{flex:1}
.onair{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--lime);color:#000;font:700 10px 'Poppins';letter-spacing:.6px;padding:3px 9px;border-radius:999px}
/*V6CSS*/
nav .ni{height:56px}
nav button{min-width:56px;height:56px;gap:0;justify-content:center;color:var(--mute)}
nav button[aria-current=page]{color:var(--lime)}
nav button[aria-current=page]::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--lime)}
nav button[aria-current=page] svg{fill:currentColor;fill-opacity:.16}
.nii{width:30px;height:30px;display:grid;place-items:center}
nav b.bg{top:7px;right:10px}
.mini{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
/*V5CSS*/
.gol{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--lime);color:#000;font:700 14px 'Poppins';margin-left:6px;box-shadow:0 4px 12px #ffd91a40}
.gol:active{transform:scale(.97)}
.pnav{display:grid;place-items:center;height:20px}
.pnav .av{margin-top:-3px}
.click{cursor:pointer}
/*V4CSS*/
.lk{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font:400 14px 'Poppins';padding:6px 0}
.stgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px;background:linear-gradient(#3b1c78,var(--s1) 75%);border:1px solid #5a37a0;border-radius:16px;padding:12px 8px}
.sgi{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;font:500 12px 'Poppins';color:#fff}
.sgi span{max-width:100%}
/*V3CSS*/
.menu{position:absolute;right:12px;top:58px;z-index:40;background:var(--s3);border:1px solid var(--line);border-radius:14px;min-width:210px;box-shadow:0 12px 32px #000d;padding:6px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:12px;border-radius:10px;font:500 15px 'Poppins'}
.menu button:hover,.menu button:focus-visible{background:var(--s4)}.menu .rdm{color:var(--red)}
.m.vm{display:flex;align-items:center;gap:10px;min-width:210px}
.vp{width:36px;height:36px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;flex:none}
.m.me .vp{background:#000;color:var(--lime)}
.vw{display:flex;align-items:center;gap:2px;flex:1;height:24px}.vw i{width:3px;background:currentColor;opacity:.55;border-radius:2px}
.vm.pl .vw i{animation:eqa .7s infinite ease-in-out;opacity:1}
.vd{font:500 12px 'Poppins';opacity:.8}
.cam{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;border:3px solid #000}

/* ===== Neon theme (colours and mood only, sizes follow the green design) ===== */
html,body{background:#0f0522}
#app{background:linear-gradient(#1a0838,#12062a 420px,#0d0420)}
.hd{background:transparent;border-bottom:0;box-shadow:none;backdrop-filter:none;transition:background .2s}
.hd.on{background:#12062af2;backdrop-filter:blur(16px);border-bottom:1px solid #3a2170}
.ibt .nd{background:#ff4d6d;box-shadow:0 0 8px #ff4d6d}
.hero2{position:relative;margin:calc(-80px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(78px + env(safe-area-inset-top,0px)) 16px 30px;min-height:236px;overflow:hidden}
.hero2 .cloud{position:absolute;inset:0;background-size:cover;background-position:70% 100%;opacity:.95;-webkit-mask-image:linear-gradient(#000 68%,transparent);mask-image:linear-gradient(#000 68%,transparent)}
.hero2 .mas{position:absolute;right:-4px;bottom:-2px;width:44%;max-width:190px;z-index:2;filter:drop-shadow(0 12px 20px #000a);animation:bob 3.4s ease-in-out infinite}
.hero2 .tx{position:relative;z-index:3;max-width:62%}
.hero2 h2{font:800 32px/1.05 'Poppins';letter-spacing:-1px}.hero2 h2 span{color:var(--yel)}
.hero2 p{color:#e0d6f7;font-size:14px;line-height:1.4;margin-top:10px;font-weight:500}
.spk1,.spk2{position:absolute;z-index:1;color:var(--yel)}.spk1{right:12px;top:84px}.spk2{right:36%;top:70px;opacity:.9}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.sbar{position:relative;z-index:4;margin-top:-26px;display:flex;align-items:center;gap:10px;width:100%;height:50px;border-radius:16px;background:#2b1856f2;border:1px solid #4a2d85;padding:0 16px;color:#a995d6;font:400 15px 'Plus Jakarta Sans';margin-bottom:14px;box-shadow:0 10px 24px -8px #000a}
.chip{background:#2b1856;border:1px solid #4a2d85;color:#e0d6f7;font:500 14px/1.25 'Poppins';padding:9px 16px;gap:6px}
.chip[aria-pressed=true]{background:var(--yel);border-color:var(--yel);color:#1a0b33;box-shadow:0 6px 16px #ffd91a44}
.dk{display:inline-block;width:11px;height:11px;border-radius:50%;background:#1a0b33}
.fc{position:relative;overflow:hidden;border-radius:20px;padding:16px;min-height:176px;border:1px solid #5a37a0;background:#241347;box-shadow:0 14px 30px -12px #000a;margin-top:6px;display:flex}
.fc .bgart{position:absolute;inset:0;opacity:.95}
.fc::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#1a0838cc 25%,#1a083822 85%)}
.micg{position:absolute;right:10px;top:34px;color:#cdb4ff;opacity:.45;filter:drop-shadow(0 0 22px #a35bff);z-index:1}
.fcx{position:relative;z-index:2;display:flex;flex-direction:column;width:100%;min-height:144px;gap:6px}
.rl{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:#150a30cc;font:700 12px 'Poppins';color:#ff5c7a;letter-spacing:.3px}
.lc{display:inline-flex;gap:5px;align-items:center;padding:5px 11px;border-radius:999px;background:#150a30cc;font:600 12.5px 'Poppins'}
.fct{font:800 22px/1.15 'Poppins';letter-spacing:-.4px;margin-top:4px}
.fcd{color:#e0d6f7;font-size:14px;line-height:1.35;max-width:68%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stk.big .av{margin-left:-10px;border:0;box-shadow:0 0 0 2px #f4eeff66}.stk.big .av:first-child{margin-left:0}
.stk.big em{width:30px;height:30px;margin-left:8px;background:#150a30;border:0;color:#e0d6f7;font:600 12px/30px 'Poppins'}
.chev{color:#e0d6f7;display:inline-flex}
.btn{box-shadow:0 6px 16px #ffd91a44}.btn.g{box-shadow:none}
.gdot{width:10px;height:10px;border-radius:50%;background:#ffd91a;box-shadow:0 0 8px #ffd91a;display:inline-block}
.bolt{color:var(--lime);display:inline-flex}
.lk{color:#b7a5e6}
.rg{box-shadow:0 0 0 2px var(--lime),0 4px 14px #ffd91a40}.rg2{box-shadow:0 0 0 2px #ffd91a88}
.bd.gw{background:#ffd91a;color:#1a0b33;border:2px solid #12062a;min-width:20px;height:20px;right:-3px;bottom:-2px}
.inv{background:#2b1856;border:1.5px dashed #6a45b8;color:#fff}
.card,.lr{background:linear-gradient(#2c1a5ecc,#221048cc);border:1px solid #4a2d85}
.thumb{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:inset 0 0 0 1px #ffffff26}
.lr.nr{align-items:center;gap:12px}.lr.nr .rt{align-items:flex-end;gap:6px}
.tg{display:inline-block;font:700 11px 'Poppins';letter-spacing:.6px;color:var(--lime);background:#ffd91a22;padding:2px 8px;border-radius:6px;margin-bottom:3px}
.mt1{color:#b7a5e6}
.stk .av{border:2px solid #241347}
.in{background:#2a1855cc;border:1px solid #4a2d85}.seg{background:#2a1855cc}
nav{background:#170a35f5;border-top:1px solid #3a2170;box-shadow:0 -4px 24px #000a}
nav b.bg{background:#ff3b5c;color:#fff}
.mini{background:linear-gradient(90deg,#3b1c78f2,#2c1560f2);border:1px solid #5a37a0}
.mini .t small i{background:#ffd91a}.mb2{background:#150a30}
.ov{background:linear-gradient(#1a0838,#0d0420)}.ph,.bar{background:#170a35ee;border-color:#3a2170}
.md>div{background:#241347;border:1px solid #4a2d85}
.stg{background:linear-gradient(#3b1c78,#241347 75%);border:1px solid #5a37a0}
.stgrid{background:linear-gradient(#3b1c78,#241347 80%);border:1px solid #5a37a0}
.cl{background:#2a1858aa;border-color:#4a2d85}.cl.me{background:#3b1c78;border-color:#5a37a0}
.opc[aria-pressed=true]{background:#3b1c78}.m{background:#2a1858;border-color:#4a2d85}
.stat{background:#2a1858aa;border-color:#4a2d85}.li{border-color:#3a2170}
.onair{background:var(--lime);color:#1a0b33}.pl.lv{border-color:#ffd91a66}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

let meter=null,actx=null;const AC=window.AudioContext||window.webkitAudioContext;
const ctxA=()=>{actx=actx||new AC();if(actx.state=='suspended')actx.resume();return actx};

async function startMeter(){
 try{const st=await navigator.mediaDevices.getUserMedia({audio:micCons()});if(!S.ov||S.ov.t!='live'){st.getTracks().forEach(t=>t.stop());return}
  const t=st.getAudioTracks()[0];S.micLabel=(t&&t.label)||'Default microphone';
  try{S.mics=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='audioinput')}catch(e){}
  const a=ctxA().createAnalyser();a.fftSize=256;ctxA().createMediaStreamSource(st).connect(a);const b=new Uint8Array(a.fftSize);
  meter={st,id:setInterval(()=>{a.getByteTimeDomainData(b);let s=0;for(const v of b){const x=(v-128)/128;s+=x*x}const l=Math.min(1,Math.sqrt(s/b.length)*4);document.querySelectorAll('.mb i').forEach((e,i)=>e.style.height=(4+Math.max(0,l*18-(i%3)*3))+'px')},90)};
  const lb=$('#mlab');if(lb)lb.textContent=S.micLabel}
 catch(e){const lb=$('#mlab');if(lb)lb.textContent='Microphone blocked or unavailable'}
}

let VA=null;const VC={};
async function playVoice(id,btn){
 if(VA&&VA.id==id&&!VA.a.paused){VA.a.pause();return}
 if(VA){VA.a.pause();VA.done&&VA.done()}
 try{if(!VC[id]){const r=await fetch('/api/voice/'+id,{headers:{Authorization:'Bearer '+S.tok}});if(!r.ok)throw 0;VC[id]=URL.createObjectURL(await r.blob())}
  const a=new Audio(VC[id]),box=btn.closest('.vm'),set=p=>{btn.innerHTML=ic(p?'pause':'play',16);box.classList.toggle('pl',p)};
  VA={id,a,done:()=>set(false)};a.onplay=()=>set(true);a.onpause=()=>set(false);a.onended=()=>set(false);await a.play()}
 catch(e){toast('Could not play this voice message')}}
const blobData=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)});
async function startRec(){
 if(!window.MediaRecorder||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return toast('Voice messages need a modern browser and HTTPS');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:micCons()});
  const mt=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000}),chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const rec={mr,chunks,t0:Date.now(),to:S.ov.id,send:false};S.rec=rec;
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearInterval(rec.tm);if(S.rec===rec)S.rec=null;if(S.ov&&S.ov.t=='chat')paintOv();if(!rec.send)return;
   const dur=Math.max(1,Math.round((Date.now()-rec.t0)/1e3)),blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});
   if(blob.size<600)return toast('That was too short');
   try{await api('/voice','POST',{to:rec.to,dur,data:await blobData(blob)})}catch(e){toast(e.message||'Could not send the voice message')}};
  mr.start();rec.tm=setInterval(()=>{const s=Math.round((Date.now()-rec.t0)/1e3),e=$('#rt');if(e)e.textContent=fmt(s);if(s>=60)stopRec(true)},250);paintOv()}
 catch(e){toast('Microphone blocked. Allow it in your browser settings')}}

 document.querySelectorAll('.av[data-t="'+u+'"]').forEach(e=>{e.style.filter=on?'drop-shadow(0 0 8px #ffd91a)':''})}},150);
const iSpeak=()=>!!S.room&&S.room.members.some(m=>m.uid==S.me.id&&m.role=='speaker');
const setTrack=async pc=>{const t=pc.getTransceivers()[0];if(t&&t.sender)try{await t.sender.replaceTrack(R.mic&&iSpeak()?R.mic:null)}catch(e){}};
const drop=u=>{delete R.an[u];const p=R.peers[u];if(!p)return;try{p.pc.close()}catch(e){}if(p.audio)p.audio.remove();delete R.peers[u]};

 const pc=new RTCPeerConnection({iceServers:ICE}),P={pc,q:[],audio:null};R.peers[u]=P;
 pc.onicecandidate=e=>{if(e.candidate)wsSend({type:'room:signal',to:u,data:{c:e.candidate}})};
 pc.ontrack=e=>{if(!P.audio){P.audio=document.createElement('audio');P.audio.autoplay=true;P.audio.muted=S.deaf;document.body.append(P.audio)}P.audio.srcObject=e.streams[0]||new MediaStream([e.track]);P.audio.play().catch(()=>{});watch(u,new MediaStream([e.track]))};
 pc.onconnectionstatechange=()=>{if(pc.connectionState=='failed')toast('A voice connection failed. Your network may block it')};
 if(off){pc.addTransceiver('audio',{direction:'sendrecv'});pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>wsSend({type:'room:signal',to:u,data:{s:pc.localDescription}})).catch(()=>{})}
 setTrack(pc);return P};
const onSignal=async(from,d)=>{if(!S.room||!d)return;
 if(d.s&&d.s.type=='offer'&&R.peers[from]&&R.peers[from].pc.remoteDescription)drop(from);
 const P=conn(from,false),pc=P.pc;
 try{if(d.s){await pc.setRemoteDescription(d.s);
   if(d.s.type=='offer'){const t=pc.getTransceivers()[0];if(t)t.direction='sendrecv';await setTrack(pc);const a=await pc.createAnswer();await pc.setLocalDescription(a);wsSend({type:'room:signal',to:from,data:{s:pc.localDescription}})}
   P.q.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}))}
  else if(d.c){pc.remoteDescription?pc.addIceCandidate(d.c).catch(()=>{}):P.q.push(d.c)}}catch(e){}};
async function syncMic(){const sp=iSpeak();
 if(sp&&!R.mic){try{const s=await navigator.mediaDevices.getUserMedia({audio:micCons()});R.mic=s.getAudioTracks()[0];watch(S.me.id,new MediaStream([R.mic]))}catch(e){toast('Microphone blocked. Allow it in your browser settings')}}
 if(!sp&&R.mic){R.mic.stop();R.mic=null;delete R.an[S.me.id]}
 if(R.mic)R.mic.enabled=!S.muted;
 Object.values(R.peers).forEach(p=>setTrack(p.pc));
 if(S.ov&&S.ov.t=='room')paintOv();else render()}
function cleanup(){S.invAsk=false;if($('#mb [data-ok]'))closeModal();Object.keys(R.peers).forEach(drop);if(R.mic){R.mic.stop();R.mic=null}if(S.me)delete R.an[S.me.id];S.room=null;S.chat=[];S.react=0;S.muted=false;S.deaf=false;if(S.ov&&S.ov.t=='room'){dropOv()}render()}
const bootRoom=async()=>{try{const r=await fetch('/api/ice',{headers:{Authorization:'Bearer '+S.tok}});if(r.ok)ICE=await r.json()}catch(e){}
 let m=/^#room=([0-9a-f]{8})$/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname);wsSend({type:'room:join',id:m[1]});return}
 m=/^#u=([0-9a-f]{12})$/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname);openProfile(m[1])}};

/* ---------- websocket + loaders ---------- */
function connect(){
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws?token='+S.tok);
 ws.onopen=()=>{retry=0};
 ws.onmessage=e=>{const d=JSON.parse(e.data),t=d.type;
  if(t=='error')return toast(d.error);
  if(t=='friends'){loadFriends(true);return}
  if(t=='follows'){loadFollows(true);return}
  if(t=='msg'){if(S.msgs.some(m=>m.id==d.m.id))return;S.msgs.push(d.m);
   const peer=d.m.from==S.me.id?d.m.to:d.m.from,open=S.ov&&S.ov.t=='chat'&&S.ov.id==peer;
   if(open){S.read[peer]=Date.now();saveRead();paintOv()}
   else if(d.m.from!=S.me.id){toast(who(d.m.from).nick+': '+String(d.m.t).slice(0,40),()=>openOv('chat',peer));if(!S.users.some(u=>u.id==d.m.from))loadUsers()}
   if(!S.ov||S.ov.t!='chat')render();return}
  if(t=='rooms'){S.rooms=d.rooms;if(!booted){booted=true;bootRoom()}if(S.room){const r=d.rooms.find(x=>x.id==S.room.id);if(r)S.room=r}if(S.ov&&S.ov.t=='all')paintOv();else if(!S.ov)render();return}
  if(t=='room:error')return toast(d.error);
  if(t=='room:joined'){S.room=d.room;S.chat=[];S.react=0;S.muted=false;d.room.members.filter(m=>m.uid!=S.me.id).forEach(m=>conn(m.uid,true));closeModal();if(!H.sent){H.sent=true;hpush()}setOv({t:'room'});stopMeter();if(d.resumed)toast('Back in the room');syncMic();return}
  if(t=='room:state'){S.room=d.room;checkInvite();syncMic();return}
  if(t=='room:declined'){toast(d.nick+' chose not to go on stage');return}
  if(t=='room:peer-left'){drop(d.uid);return}
  if(t=='room:ended'){if(S.room){cleanup();toast('The host ended the room')}return}
  if(t=='room:chat'){S.chat.push(d);if(S.chat.length>100)S.chat.shift();if(['👏','🔥','❤️'].includes(d.t))S.react++;addChat(d);return}
  if(t=='room:signal')onSignal(d.from,d.data)};
 ws.onclose=e=>{if(S.room)cleanup();if(e.code==4401){try{localStorage.removeItem('pw_tok')}catch(x){}return location.reload()}setTimeout(connect,Math.min(8000,1000*++retry))};
}
async function loadUsers(){try{S.users=await api('/users');if(!S.ov)render()}catch(e){}}
async function loadFeed(){try{S.feed=await api('/feed');if(S.tab=='feed'&&!S.ov)render()}catch(e){}}
async function loadFollows(notify){try{const prev=S.fol,f=await api('/follows');
 if(notify){const n=f.followers.find(u=>!prev.followers.some(x=>x.id==u.id));if(n)toast(n.nick+' started following you',()=>goTab('profile'))}
 S.fol=f;try{S.me=await api('/me')}catch(e){}f.followers.concat(f.following).forEach(u=>{if(!S.users.some(x=>x.id==u.id))S.users.push(u)});
 if(!S.ov)keep(render)}catch(e){}}
async function loadFriends(notify){try{const prev=S.fr,f=await api('/friends');
 if(notify){const nw=f.incoming.find(u=>!prev.incoming.some(x=>x.id==u.id));if(nw)toast(nw.nick+' sent you a friend request',()=>goTab('inbox','friends'));
  const ac=f.friends.find(u=>prev.outgoing.some(x=>x.id==u.id));if(ac)toast(ac.nick+' accepted your friend request',()=>goTab('inbox','friends'))}
 S.fr=f;f.friends.concat(f.incoming,f.outgoing).forEach(u=>{if(!S.users.some(x=>x.id==u.id))S.users.push(u)});
 if(S.ov&&S.ov.t=='chat')paintOv();else if(S.ov&&(S.ov.t=='notif'||S.ov.t=='search'))paintOv();else if(!S.ov)keep(render)}catch(e){}}
async function boot(me){S.me=me;dropOv();try{S.msgs=await api('/messages')}catch(e){S.msgs=[]}
 await loadUsers();await loadFriends();await loadFollows();connect();clearInterval(tmr);tmr=setInterval(()=>{loadUsers();loadFriends();loadFollows()},20000);S.tab='discover';render()}
window.addEventListener('scroll',()=>{const x=$('#hd');if(x)x.classList.toggle('on',scrollY>6)},{passive:true});
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{if(S.tok){try{return await boot(await api('/me'))}catch(e){S.tok=null}}S.ov={t:'auth'};paintOv()})();
</script>
