<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Whassabi operations</title>
<style>body{margin:0;padding:24px;background:#10091c;color:#f6f3ff;font:15px system-ui}main{max-width:760px;margin:auto}section{padding:20px;margin:18px 0;background:#1d1329;border:1px solid #473452;border-radius:18px}input,button,select{box-sizing:border-box;padding:11px;border-radius:10px;font:inherit;margin:6px 6px 6px 0}input,select{background:#10091c;color:inherit;border:1px solid #69547c;max-width:100%}input{width:100%}button{background:#d4ff63;color:#162000;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}p{line-height:1.5;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{padding:12px 0;border-bottom:1px solid #69547c}h1,h2{margin:0 0 14px}a{color:#d4ff63}</style></head>
<body><main><h1>Whassabi operations</h1><section id="login"><label>Operator token<input id="token" type="password" autocomplete="off" spellcheck="false"></label><button id="unlock">Open dashboard</button><p>The token stays in this tab’s memory. Closing the tab signs you out.</p></section><p id="message" role="status" aria-live="polite"></p><div id="dashboard" hidden><button id="refresh">Refresh</button><button id="lock">Lock dashboard</button><section><h2>Service status</h2><pre id="status"></pre></section><section><h2>Backups</h2><button id="backup">Create snapshot</button><select id="snapshots" aria-label="Snapshot"></select><button id="check">Check recovery</button><p>Recovery checks validate the snapshot without changing live data.</p></section><section><h2>Reports</h2><div id="reports"></div></section></div><p><a href="/neon">Return to Whassabi</a></p></main>
<script>
let token='',generation=0;const $=id=>document.getElementById(id),message=text=>{$('message').textContent=text};
async function api(path,method='GET',body){const response=await fetch('/internal/ops/'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,referrerPolicy:'no-referrer'});const result=await response.json();if(!response.ok)throw Error(result.error||'Operation failed');return result}
async function load(){const epoch=generation,key=token;try{const [status,backups,reports]=await Promise.all([api('status'),api('backups'),api('reports')]);if(epoch!==generation||key!==token)return;$('status').textContent=JSON.stringify(status,null,2);$('snapshots').replaceChildren();for(const backup of backups){const option=document.createElement('option');option.value=backup.id;option.textContent=new Date(backup.created).toLocaleString()+' · '+Math.round(backup.bytes/1024)+' KB';$('snapshots').append(option)}$('reports').replaceChildren();if(!reports.length)$('reports').textContent='No reports.';for(const report of reports){const article=document.createElement('article'),title=document.createElement('strong'),details=document.createElement('p');title.textContent=(report.reason||'other')+' · '+(report.status||'open');details.style.whiteSpace='pre-wrap';details.textContent=(report.details||'No details provided.')+'\nReported account: '+(report.whoNick||'Unknown')+' ('+report.who+')\nSubmitted by: '+(report.byNick||'Unknown')+' ('+report.by+')\n'+new Date(report.ts).toLocaleString();article.append(title,details);for(const [label,status] of [['Mark reviewed','reviewed'],['Dismiss','dismissed']]){const button=document.createElement('button');button.textContent=label;button.onclick=async()=>{try{await api('reports/'+encodeURIComponent(report.id),'PATCH',{status});await load()}catch(error){message(error.message)}};article.append(button)}$('reports').append(article)}$('dashboard').hidden=false;$('login').hidden=true}catch(error){if(epoch===generation)message(error.message)}}
$('unlock').onclick=async()=>{generation++;token=$('token').value.trim();$('token').value='';await load()};$('refresh').onclick=load;$('lock').onclick=()=>{generation++;token='';$('dashboard').hidden=true;$('login').hidden=false;$('status').textContent='';$('reports').replaceChildren();$('snapshots').replaceChildren();message('Dashboard locked.')};
$('backup').onclick=async()=>{const button=$('backup');button.disabled=true;try{await api('backup','POST',{});await load();message('Snapshot created.')}catch(error){message(error.message)}finally{button.disabled=false}};
$('check').onclick=async()=>{const id=$('snapshots').value;if(!id)return message('Choose a snapshot first.');$('check').disabled=true;try{const result=await api('restore','POST',{id,dryRun:true});message('Integrity check passed: '+result.records+' records and '+result.objects+' files. Live data was unchanged.')}catch(error){message(error.message)}finally{$('check').disabled=false}};
</script></body></html>
